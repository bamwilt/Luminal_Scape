# symbols_readme.properties
# ============================================================
# Formato de un nivel (ver level_01.txt):
#     name: Titulo del nivel   <- un titulo corto (lo muestra el juego)
#     time: 02:00              <- duracion en mm:ss (por defecto 1 minuto)
#     map:                     <- debajo van las filas del mapa
#     (OJO: debajo de "map:" un '#' ya NO es comentario: es el simbolo de
#      decoracion. Los comentarios solo valen por encima de "map:".)
# ============================================================
# SIMBOLOS :
# ============================================================
# \u25a0\u00a0 = Muro horizontal
# \u25d9 = Muro vertical
# \u25a3 = Ventana 
# \u25e7 = Puerta 
# \u25eb = Piso con techo 
# \u2592 = Piso sin techo 
# \u25f0 = piso con barandilla 
# \u0023 = Decoracion: una pieza del catalogo (es piso, se puede pisar)
# \u25c8 = Item / artefacto
# \u25b2 = Spawn mirando al norte 
# \u25bc = Spawn mirando al sur
# \u25c0 = Spawn mirando al este
# \u25b6 = Spawn mirando al oeste
# \u25a1 = Vacio (no se construye nada)
#aclaraciones: las puertas y ventanas deben tener muros al lado
# ============================================================